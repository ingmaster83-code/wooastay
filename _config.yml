title: 우아숙박 - 전국 모텔·호텔·펜션·게스트하우스 찾기
description: >-
  전국 모텔·호텔·펜션·게스트하우스·리조트의 주소와 전화번호, 객실 수를 동네별로 확인하세요.
url: "https://wooastay.wooahouse.com"
baseurl: ""
lang: ko
timezone: Asia/Seoul
author: WooaHouse

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - scripts/
  - data/
  - "*.py"
  - "*.log"
  - README.md
  - .gitignore
  - .env
  - vendor/
  - _rawdata/

# 설계 메모: 행안부 LOCALDATA 숙박업 인허가 CSV(영업/정상)를 가공한 _rawdata/st_{시도}.json 으로
# 시도→시군구→동 허브 + 종류×(시도/시군구/동) 허브 + 시설 상세를 생성한다. 사이트맵은 st_generator.rb 분할본.
